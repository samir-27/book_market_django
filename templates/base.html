<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Second-Hand Books</title>
    <!-- Bootstrap 5 CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="{{ url('book_list') }}">📚 BookMarket</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <form class="d-flex mx-auto w-50 my-2 my-lg-0" action="{{ url('book_list') }}" method="GET">
                    <!-- request.GET.get('q', '') keeps the search term in the box after submitting -->
                    <input class="form-control me-2" type="search" placeholder="Search title, author, or ISBN..." aria-label="Search" name="q" value="{{ request.GET.get('q', '') }}">
                    <button class="btn btn-outline-light" type="submit">Search</button>
                </form>
<ul class="navbar-nav ms-auto">
{% if request.user.is_authenticated %}
              
                        <li class="nav-item me-3">
                            <a class="btn btn-warning fw-bold" href="{{ url('sell_book') }}">+ Sell a Book</a>
                        </li>
    
                        <li class="nav-item">
                            <span class="nav-link text-white">Hello, {{ request.user.username }}</span>
                        </li>
                        <li class="nav-item">
                            <form action="{{ url('logout') }}" method="POST" class="d-inline">
                                {{ csrf_input }}
                                <button type="submit" class="btn btn-link nav-link border-0 bg-transparent text-white">Logout</button>
                            </form>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url('login') }}">Login</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url('register') }}">Register</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap 5 JS (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
